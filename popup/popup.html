    <!-- Background orbs -->
    <div class="background-orb orb-1"></div>
    <div class="background-orb orb-2"></div>

    <!-- Main container -->
    <div class="app-container">
        <!-- Error banner (auth / risk / network), hidden by default -->
        <div id="error-banner" class="error-banner hidden" role="alert">
            <svg class="icon" aria-hidden="true"><use href="#icon-exclamation-triangle"></use></svg>
            <span id="error-banner-text"></span>
            <button id="error-banner-close" class="error-banner-close" data-i18n-title="dismiss"><svg class="icon" aria-hidden="true"><use href="#icon-times"></use></svg></button>
        </div>

        <!-- Card grid -->
        <main id="grid-container" class="grid-view">
            <div class="loading-state">
                <div class="spinner"></div>
                <p data-i18n="syncing"></p>
            </div>
        </main>

        <!-- FAB cluster: settings button with a hover-revealed display-mode dial.
             Dial order puts the default mode nearest the settings button, i.e.
             nearest the cursor that just opened it. -->
        <div class="fab-container" id="fab-container">
            <div class="fab-dial" id="fab-dial">
                <button class="floating-btn fab-mini" data-view="all"><svg class="icon" aria-hidden="true"><use href="#icon-users"></use></svg></button>
                <button class="floating-btn fab-mini" data-view="mark"><svg class="icon" aria-hidden="true"><use href="#icon-heart"></use></svg></button>
                <button class="floating-btn fab-mini" data-view="medal"><svg class="icon" aria-hidden="true"><use href="#icon-medal"></use></svg></button>
                <button class="floating-btn fab-mini" data-view="alert"><svg class="icon" aria-hidden="true"><use href="#icon-bell"></use></svg></button>
            </div>
            <button id="fab-settings" class="floating-btn" data-i18n-title="settingsTitle"><svg class="icon" aria-hidden="true"><use href="#icon-cog"></use></svg></button>
        </div>

        <!-- Settings panel (overlay) -->
        <div id="settings-panel" class="settings-overlay hidden">
            <div class="settings-card glass-panel">
                <div class="settings-header">
                    <h3 data-i18n="settingsTitle"></h3>
                    <button id="btn-close-settings" class="icon-btn close-btn"><svg class="icon" aria-hidden="true"><use href="#icon-times"></use></svg></button>
                </div>

                <div class="settings-body">

                    <!-- Appearance (accordion) -->
                    <div class="accordion-wrapper">
                        <button id="btn-toggle-appearance" class="accordion-header">
                            <div class="header-left">
                                <div class="icon-box"><svg class="icon" aria-hidden="true"><use href="#icon-paint-brush"></use></svg></div>
                                <span data-i18n="appearance"></span>
                            </div>
                            <svg class="icon arrow-icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
                        </button>

                        <div id="appearance-content" class="accordion-content">
                            <div class="accordion-inner">
                                <!-- Theme Selection -->
                                <div class="setting-item">
                                    <label data-i18n="theme"></label>
                                    <div class="select-wrapper">
                                        <select id="select-theme">
                                            <option value="light" data-i18n="themeLight"></option>
                                            <option value="dark" data-i18n="themeDark"></option>
                                        </select>
                                        <svg class="icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
                                    </div>
                                </div>

                                <!-- Window width -->
                                <div class="setting-item range-item" id="wrap-width">
                                    <div class="label-row">
                                        <label data-i18n="windowWidth"></label>
                                        <input type="number" id="num-width" class="manual-input">
                                    </div>
                                    <input type="range" id="range-width" min="300" max="800" step="10">
                                </div>

                                <!-- Window height (max 600 due to Chrome popup constraints) -->
                                <div class="setting-item range-item" id="wrap-height">
                                    <div class="label-row">
                                        <label data-i18n="windowHeight"></label>
                                        <input type="number" id="num-height" class="manual-input">
                                    </div>
                                    <input type="range" id="range-height" min="300" max="600" step="10">
                                </div>

                                <!-- Avatar size -->
                                <div class="setting-item range-item" id="wrap-avatar">
                                    <div class="label-row">
                                        <label data-i18n="avatarSize"></label>
                                        <input type="number" id="num-avatar" class="manual-input">
                                    </div>
                                    <input type="range" id="range-avatar" min="30" max="120" step="2">
                                </div>

                                <!-- Column gap -->
                                <div class="setting-item range-item" id="wrap-gap-x">
                                    <div class="label-row">
                                        <label data-i18n="columnGapX"></label>
                                        <input type="number" id="num-gap-x" class="manual-input">
                                    </div>
                                    <input type="range" id="range-gap-x" min="0" max="30" step="2">
                                </div>

                                <!-- Row gap -->
                                <div class="setting-item range-item" id="wrap-gap-y">
                                    <div class="label-row">
                                        <label data-i18n="rowGapY"></label>
                                        <input type="number" id="num-gap-y" class="manual-input">
                                    </div>
                                    <input type="range" id="range-gap-y" min="0" max="30" step="2">
                                </div>

                                <!-- Card padding X -->
                                <div class="setting-item range-item" id="wrap-padding-x">
                                    <div class="label-row">
                                        <label data-i18n="cardPaddingX"></label>
                                        <input type="number" id="num-padding-x" class="manual-input">
                                    </div>
                                    <input type="range" id="range-padding-x" min="0" max="30" step="2">
                                </div>

                                <!-- Card padding Y -->
                                <div class="setting-item range-item" id="wrap-padding-y">
                                    <div class="label-row">
                                        <label data-i18n="cardPaddingY"></label>
                                        <input type="number" id="num-padding-y" class="manual-input">
                                    </div>
                                    <input type="range" id="range-padding-y" min="0" max="30" step="2">
                                </div>

                                <!-- Text size -->
                                <div class="setting-item range-item" id="wrap-font">
                                    <div class="label-row">
                                        <label data-i18n="textSize"></label>
                                        <input type="number" id="num-font" class="manual-input">
                                    </div>
                                    <input type="range" id="range-font" min="10" max="16" step="1">
                                </div>

                                <div class="setting-item toggle-row">
                                    <label data-i18n="cardBackground"></label>
                                    <label class="switch">
                                        <input type="checkbox" id="check-card-bg" checked>
                                        <span class="slider round"></span>
                                    </label>
                                </div>

                                <button id="btn-reset-appearance" class="btn text-only full-width" data-i18n="resetToDefaults"></button>
                            </div>
                        </div>
                    </div>

                    <div class="spacer"></div>

                    <!-- General settings -->
                    <!-- Alert scope: sources x channels. The checked sources also
                         decide what gets fetched, so there is no second switch
                         that can silently void this one. -->
                    <div class="section-title">
                        <div class="icon-box" style="background: var(--accent-blue);"><svg class="icon" aria-hidden="true"><use href="#icon-bell"></use></svg></div>
                        <span data-i18n="alertScope"></span>
                    </div>

                    <div class="setting-group">
                        <table class="scope-matrix">
                            <tr class="mx-head">
                                <th></th>
                                <th class="mx-col"><span class="mx-colwrap"><svg class="icon" aria-hidden="true"><use href="#icon-square"></use></svg><span data-i18n="channelBadge"></span></span></th>
                                <th class="mx-col"><span class="mx-colwrap"><svg class="icon" aria-hidden="true"><use href="#icon-bell"></use></svg><span data-i18n="channelNotify"></span></span></th>
                            </tr>
                            <tr class="mx-row">
                                <td>
                                    <div class="mx-name">
                                        <span class="mx-glyph src-medal"><svg class="icon" aria-hidden="true"><use href="#icon-medal"></use></svg></span>
                                        <span class="mx-text">
                                            <span class="mx-line">
                                                <span data-i18n="sourceMedal"></span>
                                                <span class="mx-n" id="count-medal"></span>
                                            </span>
                                        </span>
                                    </div>
                                </td>
                                <td><div class="mx-cell"><button class="cbox" id="chk-badge-medal" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                                <td><div class="mx-cell"><button class="cbox warm" id="chk-notify-medal" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                            </tr>
                            <tr class="mx-row">
                                <td>
                                    <div class="mx-name">
                                        <span class="mx-glyph src-custom"><svg class="icon" aria-hidden="true"><use href="#icon-plus-circle"></use></svg></span>
                                        <span class="mx-text">
                                            <span class="mx-line">
                                                <span data-i18n="sourceCustom"></span>
                                                <span class="mx-n" id="count-custom"></span>
                                            </span>
                                        </span>
                                    </div>
                                </td>
                                <td><div class="mx-cell"><button class="cbox" id="chk-badge-custom" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                                <td><div class="mx-cell"><button class="cbox warm" id="chk-notify-custom" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                            </tr>
                            <tr class="mx-row">
                                <td>
                                    <div class="mx-name">
                                        <span class="mx-glyph src-fav"><svg class="icon" aria-hidden="true"><use href="#icon-heart"></use></svg></span>
                                        <span class="mx-text">
                                            <span class="mx-line">
                                                <span data-i18n="sourceFav"></span>
                                                <span class="mx-n" id="count-fav"></span>
                                            </span>
                                        </span>
                                    </div>
                                </td>
                                <td><div class="mx-cell"><button class="cbox" id="chk-badge-fav" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                                <td><div class="mx-cell"><button class="cbox warm" id="chk-notify-fav" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                            </tr>
                            <tr class="mx-row">
                                <td>
                                    <div class="mx-name">
                                        <span class="mx-glyph src-like"><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg></span>
                                        <span class="mx-text">
                                            <span class="mx-line">
                                                <span data-i18n="sourceLike"></span>
                                                <span class="mx-n" id="count-like"></span>
                                            </span>
                                        </span>
                                    </div>
                                </td>
                                <td><div class="mx-cell"><button class="cbox" id="chk-badge-like" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                                <td><div class="mx-cell"><button class="cbox warm" id="chk-notify-like" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                            </tr>
                            <tr class="mx-row">
                                <td>
                                    <div class="mx-name">
                                        <span class="mx-glyph src-rest"><svg class="icon" aria-hidden="true"><use href="#icon-users"></use></svg></span>
                                        <span class="mx-text">
                                            <span class="mx-line">
                                                <span data-i18n="sourceRest"></span>
                                                <span class="mx-n" id="count-rest"></span>
                                            </span>
                                    <span class="mx-sub" data-i18n="sourceRestHint"></span>
                                        </span>
                                    </div>
                                </td>
                                <td><div class="mx-cell"><button class="cbox" id="chk-badge-rest" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                                <td><div class="mx-cell"><button class="cbox warm" id="chk-notify-rest" role="checkbox" aria-checked="false"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg></button></div></td>
                            </tr>
                        </table>

                        <div class="mx-foot">
                            <span class="tally" id="scope-tally-badge"></span>
                            <span class="tally warm" id="scope-tally-notify"></span>
                            <span class="tally cost" id="scope-cost"></span>
                        </div>

                        <div class="hint" id="scope-union-hint"></div>
                        <div class="hint" data-i18n="sourceExclusiveHint"></div>
                        <div class="hint" data-i18n="scopeSeedHint"></div>
                    </div>

                    <div class="spacer"></div>

                    <div class="section-title">
                        <div class="icon-box"><svg class="icon" aria-hidden="true"><use href="#icon-sliders-h"></use></svg></div>
                        <span data-i18n="general"></span>
                    </div>

                    <div class="setting-group">
                        <div class="setting-item">
                            <label data-i18n="refreshInterval"></label>
                            <input type="number" id="input-interval" min="30" value="60" class="styled-input">
                        </div>

                        <div class="setting-item">
                            <label data-i18n="previewMode"></label>
                            <div class="select-wrapper">
                                <select id="select-preview-mode">
                                    <option value="thumbnail" data-i18n="previewThumbnail"></option>
                                    <option value="live" data-i18n="previewLive"></option>
                                </select>
                                <svg class="icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
                            </div>
                        </div>

                        <div class="setting-item" id="wrap-preview-sound">
                            <div class="label-row">
                                <label data-i18n="previewSound"></label>
                                <label class="switch">
                                    <input type="checkbox" id="check-preview-sound">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>

                        <div class="setting-item" id="wrap-preview-volume">
                            <div class="label-row">
                                <label data-i18n="volume"></label>
                                <span id="val-preview-volume" style="font-size:12px; font-weight:600; color:var(--accent-blue);"></span>
                            </div>
                            <input type="range" id="range-preview-volume" min="0" max="100" step="1">
                        </div>
                    </div>

                    <div class="spacer"></div>

                    <!-- Custom rooms management (accordion) -->
                    <div class="accordion-wrapper" id="accordion-custom-rooms">
                        <button id="btn-toggle-custom-rooms" class="accordion-header">
                            <div class="header-left">
                                <div class="icon-box" style="background: var(--bilibili-pink);"><svg class="icon" aria-hidden="true"><use href="#icon-plus-circle"></use></svg></div>
                                <span data-i18n="customRooms"></span>
                            </div>
                            <svg class="icon arrow-icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
                        </button>

                        <div id="custom-rooms-content" class="accordion-content">
                            <div class="accordion-inner">
                                <div class="setting-item">
                                    <label data-i18n="addRoom"></label>
                                    <div class="custom-room-input-row">
                                        <input type="text" id="input-add-room" class="styled-input" data-i18n-placeholder="addRoomPlaceholder">
                                        <button id="btn-add-room" class="btn primary btn-add-room" data-i18n-title="addRoom"><svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg></button>
                                    </div>
                                    <div id="add-room-status" class="custom-room-status hidden"></div>
                                </div>
                                <div id="custom-room-list" class="custom-room-list"></div>
                            </div>
                        </div>
                    </div>

                    <div class="spacer"></div>

                    <div class="settings-actions">
                        <button id="btn-deleted" class="btn secondary" data-i18n="hiddenList"></button>
                        <div class="file-ops">
                            <button id="btn-export" class="btn icon-only" data-i18n-title="exportSettings"><svg class="icon" aria-hidden="true"><use href="#icon-upload"></use></svg></button>
                            <button id="btn-import" class="btn icon-only" data-i18n-title="importSettings"><svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg></button>
                            <input type="file" id="file-import" accept=".json" hidden>
                        </div>
                    </div>

                    <div class="spacer"></div>

                    <!-- Manual refresh -->
                    <button id="btn-manual-refresh" class="btn primary full-width">
                        <svg class="icon" aria-hidden="true"><use href="#icon-sync-alt"></use></svg> <span data-i18n="refreshData"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Hidden streamers panel -->
        <div id="deleted-panel" class="settings-overlay hidden">
            <div class="settings-card glass-panel">
                <div class="settings-header">
                    <h3 data-i18n="hiddenStreamers"></h3>
                    <button id="btn-close-deleted" class="icon-btn close-btn"><svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg></button>
                </div>
                <div id="deleted-list" class="deleted-list-container"></div>
            </div>
        </div>

        <!-- Hover preview card -->
        <div id="preview-tooltip" class="preview-card glass-panel hidden">
            <div class="preview-image-wrapper">
                <img id="preview-img" src="" alt="">
                <iframe id="preview-iframe" class="hidden" frameborder="0" scrolling="no" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                <div id="preview-loader" class="preview-loader"><div class="spinner-small"></div></div>
            </div>
            <div class="preview-info">
                <h4 id="preview-title" data-i18n="loading"></h4>
                <span id="preview-time">--:--</span>
            </div>
        </div>
    </div>

    <!-- Context menu -->
    <div id="context-menu" class="glass-menu hidden">
        <div class="menu-item" data-action="favorite"><svg class="icon" aria-hidden="true"><use href="#icon-heart"></use></svg> <span data-i18n="favorite"></span></div>
        <div class="menu-item" data-action="like"><svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg> <span data-i18n="like"></span></div>
        <div class="menu-divider"></div>
        <div class="menu-item danger" data-action="hide"><svg class="icon" aria-hidden="true"><use href="#icon-eye-slash"></use></svg> <span data-i18n="hide"></span></div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
