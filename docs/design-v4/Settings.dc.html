<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --accent-blue: #007aff;
      --accent-red: #ff3b30;
      --accent-orange: #ff9500;
      --bilibili-pink: #fb7299;
      --border-color: rgba(0, 0, 0, 0.08);
      --settings-body-bg: #ffffff;
      --accordion-content-bg: #fbfbfd;
      --input-bg: #f5f5f7;
      --input-bg-focus: #ffffff;
      --input-border: #e0e0e0;
      --btn-secondary-bg: #f2f2f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 500px;
      height: 550px;
      overflow: hidden;
      background: var(--bg-color);
      color: var(--text-primary);
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      user-select: none;
    }
    a { color: var(--accent-blue); text-decoration: none; }
    a:hover { color: #0063cc; }

    /* Blurred grid behind the overlay, so the panel reads as an overlay */
    .behind {
      position: absolute; inset: 0;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-content: start;
    }
    .ghost-card { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .ghost-face { width: 84px; height: 84px; border-radius: 50%; }
    .ghost-line { width: 62px; height: 9px; border-radius: 5px; background: rgba(0, 0, 0, 0.09); }

    .overlay {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .panel {
      width: 86%;
      max-height: 85%;
      background: var(--card-bg);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .phead {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }
    .phead h3 { margin: 0; font-size: 17px; font-weight: 600; }
    .xbtn {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .xbtn:hover { background: rgba(0, 0, 0, 0.1); color: var(--text-primary); }

    .pbody { flex: 1; overflow-y: auto; padding: 20px; }
    .pbody::-webkit-scrollbar { width: 0; }

    .sect {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .ibox {
      width: 24px; height: 24px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; background: #8e8e93;
      flex-shrink: 0;
    }
    .ibox.blue { background: var(--accent-blue); }
    .ibox.pink { background: var(--bilibili-pink); }

    .group {
      background: var(--settings-body-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
    }
    .item { margin-bottom: 16px; }
    .item:last-child { margin-bottom: 0; }
    .item > label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .hint { font-size: 11px; line-height: 1.45; color: var(--text-secondary); margin-top: 8px; }
    .hint b { color: var(--text-primary); font-weight: 600; }

    /* ---------- Alert-scope matrix (the new model) ---------- */
    .matrix { width: 100%; border-collapse: collapse; }
    .matrix th, .matrix td { padding: 0; }
    .mx-head th {
      padding-bottom: 9px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.2px;
    }
    .mx-head th.col { width: 50px; text-align: center; }
    .mx-head .colwrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .mx-row td { padding: 7px 0; border-top: 1px solid rgba(0, 0, 0, 0.06); }
    .mx-row:first-child td { border-top: none; }
    .mx-name { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .mx-name .glyph { width: 17px; display: flex; justify-content: center; flex-shrink: 0; }
    .mx-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .mx-line { display: flex; align-items: center; }
    .mx-sub { font-size: 11px; line-height: 1.35; color: var(--text-secondary); }
    .glyph.fav { color: var(--accent-red); }
    .glyph.like { color: var(--accent-orange); }
    .glyph.medal { color: #b8860b; }
    .glyph.custom { color: var(--accent-blue); }
    .glyph.rest { color: #a1a1a6; }
    .mx-n {
      margin-left: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .cell { display: flex; justify-content: center; }
    .cbox {
      width: 21px; height: 21px; border-radius: 6px;
      border: 1.5px solid #c7c7cc;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .cbox:hover { border-color: var(--accent-blue); }
    .cbox.on { background: var(--accent-blue); border-color: var(--accent-blue); }
    .cbox.on.warm { background: var(--bilibili-pink); border-color: var(--bilibili-pink); }
    .cbox .tick { opacity: 0; }
    .cbox.on .tick { opacity: 1; }

    .mx-foot {
      display: flex; align-items: center; gap: 8px;
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .tally {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px;
      border-radius: 8px;
      background: rgba(0, 122, 255, 0.1);
      color: var(--accent-blue);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .tally.warm { background: rgba(251, 114, 153, 0.12); color: #d1436a; }
    .tally.off { background: rgba(120, 120, 128, 0.12); color: var(--text-secondary); }
    /* Request cost: neutral when cheap, amber once following paging turns on */
    .tally.cost { margin-left: auto; background: rgba(52, 199, 89, 0.14); color: #1e7a3c; }
    .tally.cost.heavy { background: rgba(255, 149, 0, 0.16); color: #a35c00; }

    /* Inputs */
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .num {
      width: 88px; padding: 8px 12px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background: var(--input-bg);
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .selectish {
      position: relative;
      width: 150px;
      padding: 8px 30px 8px 12px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background: var(--input-bg);
      font-size: 13px;
    }
    .selectish svg { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

    /* Accordions */
    .acc {
      background: var(--settings-body-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .acc-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
    }
    .acc-head:hover { background: #f9f9fa; }
    .acc-left { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; }
    .acc-head .chev { color: var(--text-secondary); }
    .spacer { height: 20px; }
    .actions { display: flex; align-items: center; justify-content: space-between; }
    .btn {
      padding: 10px 16px; border-radius: 10px; border: none;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer;
    }
    .btn.sec { background: var(--btn-secondary-bg); color: var(--text-primary); }
    .btn.pri {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent-blue); color: #fff;
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
    }
    .iconbtns { display: flex; gap: 8px; }
    .iconbtn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--settings-body-bg);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .iconbtn:hover { color: var(--accent-blue); border-color: var(--accent-blue); }
  </style>
</helmet>

<div class="behind">
  <div class="ghost-card"><div class="ghost-face" style="background: #fb7299"></div><div class="ghost-line"></div></div>
  <div class="ghost-card"><div class="ghost-face" style="background: #7d9bf5"></div><div class="ghost-line"></div></div>
  <div class="ghost-card"><div class="ghost-face" style="background: #9b7df5"></div><div class="ghost-line"></div></div>
  <div class="ghost-card"><div class="ghost-face" style="background: #f5c14f"></div><div class="ghost-line"></div></div>
  <div class="ghost-card"><div class="ghost-face" style="background: #4fc3f5"></div><div class="ghost-line"></div></div>
  <div class="ghost-card"><div class="ghost-face" style="background: #c78ef5"></div><div class="ghost-line"></div></div>
  <div class="ghost-card"><div class="ghost-face" style="background: #6fd6b3"></div><div class="ghost-line"></div></div>
  <div class="ghost-card"><div class="ghost-face" style="background: #5b8def"></div><div class="ghost-line"></div></div>
</div>

<div class="overlay">
  <div class="panel">
    <div class="phead">
      <h3>設定</h3>
      <div class="xbtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </div>
    </div>

    <div class="pbody">

      <!-- Alert scope: the single model. It also decides what gets fetched,
           so the old 監控範圍 radio is gone. -->
      <div class="sect">
        <span class="ibox blue">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </span>
        <span>提醒範圍</span>
      </div>
      <div class="group">
        <table class="matrix">
          <tr class="mx-head">
            <th></th>
            <th class="col">
              <div class="colwrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm14 6a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
                <span>角標</span>
              </div>
            </th>
            <th class="col">
              <div class="colwrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                <span>通知</span>
              </div>
            </th>
          </tr>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
            <tr class="mx-row">
              <td>
                <div class="mx-name">
                  <span class="glyph {{r.kind}}" style="align-self: {{r.glyphAlign}}">
                    <sc-if value="{{r.isMedal}}" hint-placeholder-val="{{ true }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm-3.2 1.1L6.5 22l3.6-1.6L12 22l1.9-1.6L17.5 22l-2.3-5.9a6.9 6.9 0 0 1-6.4 0z"/></svg>
                    </sc-if>
                    <sc-if value="{{r.isCustom}}" hint-placeholder-val="{{ false }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
                    </sc-if>
                    <sc-if value="{{r.isFav}}" hint-placeholder-val="{{ false }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </sc-if>
                    <sc-if value="{{r.isLike}}" hint-placeholder-val="{{ false }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </sc-if>
                    <sc-if value="{{r.isRest}}" hint-placeholder-val="{{ false }}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    </sc-if>
                  </span>
                  <span class="mx-text">
                    <span class="mx-line">
                      <span>{{r.label}}</span>
                      <span class="mx-n">{{r.count}}</span>
                    </span>
                    <sc-if value="{{r.hasSub}}" hint-placeholder-val="{{ false }}">
                      <span class="mx-sub">{{r.sub}}</span>
                    </sc-if>
                  </span>
                </div>
              </td>
              <td>
                <div class="cell">
                  <div class="cbox {{r.badgeCls}}" onClick="{{ r.toggleBadge }}">
                    <svg class="tick" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                  </div>
                </div>
              </td>
              <td>
                <div class="cell">
                  <div class="cbox warm {{r.notifyCls}}" onClick="{{ r.toggleNotify }}">
                    <svg class="tick" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                  </div>
                </div>
              </td>
            </tr>
          </sc-for>
        </table>

        <div class="mx-foot">
          <span class="tally {{badgeTallyCls}}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm14 6a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
            {{badgeTally}}
          </span>
          <span class="tally warm {{notifyTallyCls}}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            {{notifyTally}}
          </span>
          <span class="tally cost {{costCls}}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.6 4 2.3-.8 1.4-4.7-2.7V6h1.5z"/></svg>
            {{cost}}
          </span>
        </div>

        <div class="hint">
          整欄取消勾選 = 關閉該通道。彈窗「提醒範圍」那個顯示模式看的是兩欄的<b>聯集</b>——任一欄勾了就算，{{unionTally}}。
        </div>
        <div class="hint">
          勾選的來源同時決定要抓什麼，所以沒有另一個「監控範圍」開關會讓這裡的設定失效。<b>首次安裝、新增來源、風控退避結束後的第一個週期只對齊狀態，不補發任何提醒</b>，角標不會再一次跳出三位數。
        </div>
      </div>

      <div class="spacer"></div>

      <!-- 3. General -->
      <div class="sect">
        <span class="ibox">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </span>
        <span>一般</span>
      </div>
      <div class="group">
        <div class="item">
          <div class="row">
            <label>刷新間隔（秒）</label>
            <div class="num">60</div>
          </div>
        </div>
        <div class="item">
          <div class="row">
            <label>懸停預覽</label>
            <div class="selectish">
              縮圖
              <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
            </div>
          </div>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="acc">
        <div class="acc-head">
          <div class="acc-left">
            <span class="ibox pink">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
            </span>
            <span>自訂房間</span>
            <span class="mx-n">3</span>
          </div>
          <span class="chev">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
          </span>
        </div>
      </div>

      <div class="acc">
        <div class="acc-head">
          <div class="acc-left">
            <span class="ibox blue">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 2 6 14l4 4L22 6zM4 16l-2 6 6-2z"/></svg>
            </span>
            <span>外觀</span>
          </div>
          <span class="chev">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
          </span>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="actions">
        <div class="btn sec">隱藏清單</div>
        <div class="iconbtns">
          <div class="iconbtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 6 9h4v8h4V9h4zM4 19h16v2H4z"/></svg>
          </div>
          <div class="iconbtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 17 6 11h4V3h4v8h4zM4 19h16v2H4z"/></svg>
          </div>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="btn pri">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
        <span>立即刷新</span>
      </div>

    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":500,"height":550}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      // Sources are shared; each channel subscribes to them independently.
      badge:  { medal: true, custom: true, fav: true, like: true, rest: false },
      notify: { medal: true, custom: true, fav: true, like: false, rest: false }
    };
  }

  sources() {
    // Counts are mutually exclusive so the tally is a plain sum.
    return [
      { key: 'medal',  label: '勳章牆主播',   count: 14 },
      { key: 'custom', label: '手動添加房間', count: 3 },
      { key: 'fav',    label: '特別關注',     count: 8 },
      { key: 'like',   label: '喜歡',         count: 21 },
      { key: 'rest',   label: '其他全部關注', count: 69 }
    ];
  }

  toggle(channel, key) {
    const next = Object.assign({}, this.state[channel]);
    next[key] = !next[key];
    this.setState({ [channel]: next });
  }

  tally(channel) {
    return this.sources().reduce(
      (sum, s) => sum + (this.state[channel][s.key] ? s.count : 0),
      0
    );
  }

  /** The popup's 提醒範圍 display mode = union of both channels. */
  unionTally() {
    return this.sources().reduce(
      (sum, s) => sum + ((this.state.badge[s.key] || this.state.notify[s.key]) ? s.count : 0),
      0
    );
  }

  renderVals() {
    const rows = this.sources().map((s) => ({
      label: s.label,
      count: s.count,
      kind: s.key,
      hasSub: s.key === 'rest',
      sub: s.key === 'rest' ? '需要翻頁抓全關注，每週期 +5 次請求' : '',
      glyphAlign: s.key === 'rest' ? 'flex-start' : 'center',
      isMedal: s.key === 'medal',
      isCustom: s.key === 'custom',
      isFav: s.key === 'fav',
      isLike: s.key === 'like',
      isRest: s.key === 'rest',
      badgeCls: this.state.badge[s.key] ? 'on' : '',
      notifyCls: this.state.notify[s.key] ? 'on' : '',
      toggleBadge: () => this.toggle('badge', s.key),
      toggleNotify: () => this.toggle('notify', s.key)
    }));

    const badgeN = this.tally('badge');
    const notifyN = this.tally('notify');
    const unionN = this.unionTally();

    // The checked sources decide what gets fetched. MedalWall (medal data is
    // needed for card display anyway) plus one batched get_status_info_by_uids
    // for custom rooms and marked uids = 2 requests. Only 'rest' needs paging.
    const needsPaging = this.state.badge.rest || this.state.notify.rest;
    const cycleCost = needsPaging ? 7 : 2;

    return {
      rows: rows,
      cost: '每週期 ' + (needsPaging ? '約 ' : '') + cycleCost + ' 次請求',
      costCls: needsPaging ? 'heavy' : '',
      badgeTally: badgeN === 0 ? '角標關閉' : ('角標 ' + badgeN + ' 人'),
      notifyTally: notifyN === 0 ? '通知關閉' : ('通知 ' + notifyN + ' 人'),
      unionTally: unionN === 0 ? '目前沒有人' : ('目前 ' + unionN + ' 人'),
      badgeTallyCls: badgeN === 0 ? 'off' : '',
      notifyTallyCls: notifyN === 0 ? 'off' : ''
    };
  }
}
</script>
</body>
</html>
